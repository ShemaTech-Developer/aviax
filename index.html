            'neon-green': '0 0 15px rgba(0, 255, 102, 0.4)',

  <!-- MAIN GAME ENGINE JAVASCRIPT -->
  <script>
    /* ==========================================================================
       AUDIO SYNTHESIZER (Web Audio API)
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.engineOsc = null;
        this.engineGain = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playChime() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      }

      playCrash() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;

        // Noise buffer for explosion
        const bufferSize = this.ctx.sampleRate * 0.5;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.exponentialRampToValueAtTime(30, now + 0.5);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        whiteNoise.start(now);
        whiteNoise.stop(now + 0.5);
      }

      startFlightTone() {
        if (this.muted) return;
        this.init();
        this.stopFlightTone();

        const now = this.ctx.currentTime;
        this.engineOsc = this.ctx.createOscillator();
        this.engineGain = this.ctx.createGain();

        this.engineOsc.type = 'sawtooth';
        this.engineOsc.frequency.setValueAtTime(110, now); // Low hum A2

        // Filter to smooth tone
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;

        this.engineGain.gain.setValueAtTime(0.05, now);

        this.engineOsc.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.ctx.destination);

        this.engineOsc.start(now);
      }

      updateFlightTone(multiplier) {
        if (this.muted || !this.engineOsc) return;
        const freq = 110 + Math.min(1000, (multiplier - 1) * 80);
        this.engineOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.1);
      }

      stopFlightTone() {
        if (this.engineOsc) {
          try {
            this.engineOsc.stop();
            this.engineOsc.disconnect();
          } catch(e) {}
          this.engineOsc = null;
        }
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       GAME STATE MANAGEMENT
       ========================================================================== */
    const STATES = {
      PREPARATION: 'PREPARATION',
      IN_FLIGHT: 'IN_FLIGHT',
      CRASHED: 'CRASHED'
    };

    let gameState = STATES.PREPARATION;
    let userBalance = 1000.00;
    let currentMultiplier = 1.00;
    let targetCrashPoint = 1.00;
    let startTime = 0;
    let prepTimer = 5.0;
    let prepInterval = null;
    let flightInterval = null;
    let history = [1.45, 2.10, 1.12, 5.80, 1.05, 3.40, 12.50, 1.88, 2.05];
    let sidebarTab = 'live';

    // Player bets state (now with cashedAt = multiplier the player cashed out at)
    const bets = {
      1: { active: false, cashedOut: false, amount: 0, payout: 0, cashedAt: 0 },
      2: { active: false, cashedOut: false, amount: 0, payout: 0, cashedAt: 0 }
    };

    // Simulated Players Data
    let botPlayers = [];
    const botNames = [
      "CyberAce", "Vortex99", "NeonRider", "Astra", "Quantum", "ShadowX",
      "Hyperion", "CryptoKnight", "Zenith", "Blaster", "PulseRunner", "Flux"
    ];

    /* ==========================================================================
       DOM ELEMENTS
       ========================================================================== */
    const userBalanceEl = document.getElementById('userBalance');
    const prepOverlay = document.getElementById('prepOverlay');
    const inFlightOverlay = document.getElementById('inFlightOverlay');
    const crashOverlay = document.getElementById('crashOverlay');
    const countdownText = document.getElementById('countdownText');
    const countdownBar = document.getElementById('countdownBar');
    const liveMultiplierText = document.getElementById('liveMultiplierText');
    const crashedMultiplierText = document.getElementById('crashedMultiplierText');
    const historyBar = document.getElementById('historyBar');
    const playersList = document.getElementById('playersList');
    const activePlayersCount = document.getElementById('activePlayersCount');

    // Bet Panel 1 Controls
    const betInput1 = document.getElementById('betInput1');
    const actionBtn1 = document.getElementById('actionBtn1');
    const autoCashoutToggle1 = document.getElementById('autoCashoutToggle1');
    const autoCashoutValue1 = document.getElementById('autoCashoutValue1');

    // Bet Panel 2 Controls
    const betInput2 = document.getElementById('betInput2');
    const actionBtn2 = document.getElementById('actionBtn2');
    const autoCashoutToggle2 = document.getElementById('autoCashoutToggle2');
    const autoCashoutValue2 = document.getElementById('autoCashoutValue2');

    /* ==========================================================================
       CANVAS RENDERING & ANIMATION
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let stars = [];
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const numStars = 80;
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2,
          speed: Math.random() * 0.5 + 0.2,
          alpha: Math.random()
        });
      }
    }

    function drawGrid(offset = 0) {
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
      ctx.lineWidth = 1;

      const gridSize = 40;
      const width = canvas.width;
      const height = canvas.height;

      // Vertical lines
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      // Horizontal animated lines
      for (let y = (offset % gridSize); y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function updateStars() {
      stars.forEach(star => {
        if (gameState === STATES.IN_FLIGHT) {
          star.y += star.speed * (1 + (currentMultiplier - 1) * 0.5);
          star.x -= star.speed * (1 + (currentMultiplier - 1) * 0.5);
        } else {
          star.y += star.speed * 0.2;
        }

        if (star.y > canvas.height) star.y = 0;
        if (star.x < 0) star.x = canvas.width;

        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function spawnExplosion(x, y) {
      particles = [];
      for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4 + 2,
          color: Math.random() > 0.5 ? '#ff0055' : '#ffcc00',
          life: 1.0
        });
      }
    }

    function updateParticles() {
      for (let idx = particles.length - 1; idx >= 0; idx--) {
        const p = particles[idx];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;

        if (p.life > 0) {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          particles.splice(idx, 1);
        }
      }
    }

    // Dynamic flight path math (shared by renderer and crash explosion)
    let flightGridOffset = 0;

    function getFlightGeometry() {
      const padding = 50;
      const startX = padding;
      const startY = canvas.height - padding;
      const progress = Math.min(1.0, (currentMultiplier - 1) / 10.0);
      const endX = startX + (canvas.width - padding * 2) * Math.min(0.85, 0.2 + progress * 0.7);
      const endY = startY - (canvas.height - padding * 2) * Math.min(0.85, 0.1 + Math.pow(progress, 0.7) * 0.75);
      const controlX = startX + (endX - startX) * 0.4;
      const controlY = startY;
      return { startX, startY, endX, endY, controlX, controlY };
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === STATES.IN_FLIGHT) {
        flightGridOffset += 1 + currentMultiplier;
      }
      drawGrid(flightGridOffset);
      updateStars();

      if (gameState === STATES.IN_FLIGHT || gameState === STATES.CRASHED) {
        const { startX, startY, endX, endY, controlX, controlY } = getFlightGeometry();

        // Draw flight trajectory glow line
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(controlX, controlY, endX, endY);
        ctx.strokeStyle = gameState === STATES.CRASHED ? '#ff0055' : '#00f3ff';
        ctx.lineWidth = 4;
        ctx.shadowColor = gameState === STATES.CRASHED ? '#ff0055' : '#00f3ff';
        ctx.shadowBlur = 15;
        ctx.stroke();

        // Fill area under flight path curve
        ctx.lineTo(endX, startY);
        ctx.lineTo(startX, startY);
        ctx.closePath();
        const gradient = ctx.createLinearGradient(0, startY, 0, endY);
        if (gameState === STATES.CRASHED) {
          gradient.addColorStop(0, 'rgba(255, 0, 85, 0.0)');
          gradient.addColorStop(1, 'rgba(255, 0, 85, 0.25)');
        } else {
          gradient.addColorStop(0, 'rgba(0, 243, 255, 0.0)');
          gradient.addColorStop(1, 'rgba(0, 243, 255, 0.25)');
        }
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.restore();

        // Render helicopter or crash explosion
        if (gameState === STATES.IN_FLIGHT) {
          drawFuturisticPlane(endX, endY, controlX, controlY);
        } else if (gameState === STATES.CRASHED) {
          updateParticles();
        }
      }

      requestAnimationFrame(renderCanvas);
    }

    // Helicopter with a small pilot, spinning main + tail rotors, and skids
    // (function name kept as drawFuturisticPlane so renderCanvas still works)
    function drawFuturisticPlane(x, y, ctrlX, ctrlY) {
      const angle = Math.atan2(y - ctrlY, x - ctrlX);
      const t = performance.now() / 1000;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(0.12 + angle * 0.25); // gentle forward tilt, stays upright
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#00f3ff';
      ctx.fillStyle = '#0f172a';

      // Tail boom
      ctx.beginPath();
      ctx.moveTo(-8, -2); ctx.lineTo(-34, -5); ctx.lineTo(-34, -1); ctx.lineTo(-8, 4);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Tail fin
      ctx.beginPath();
      ctx.moveTo(-34, -5); ctx.lineTo(-38, -13); ctx.lineTo(-30, -5);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Tail rotor (spinning)
      ctx.save();
      ctx.translate(-37, -8);
      ctx.rotate(t * 40);
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 6);
      ctx.strokeStyle = '#9d00ff'; ctx.stroke();
      ctx.restore();

      // Body
      ctx.beginPath();
      ctx.ellipse(4, 2, 17, 11, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a'; ctx.fill(); ctx.stroke();

      // Cockpit glass
      ctx.beginPath();
      ctx.ellipse(11, 0, 9, 7, 0, Math.PI, Math.PI * 2.5);
      ctx.fillStyle = 'rgba(0, 243, 255, 0.35)'; ctx.fill(); ctx.stroke();

      // Pilot
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(12, -1, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#9d00ff';
      ctx.fillRect(9, 2, 6, 5);
      ctx.shadowBlur = 10;

      // Skids
      ctx.strokeStyle = '#00ff66';
      ctx.beginPath();
      ctx.moveTo(-8, 17); ctx.lineTo(18, 17);
      ctx.moveTo(-2, 11); ctx.lineTo(-4, 17);
      ctx.moveTo(10, 11); ctx.lineTo(12, 17);
      ctx.stroke();

      // Main rotor mast + spinning blades (length oscillates for a blur effect)
      ctx.strokeStyle = '#00f3ff';
      ctx.beginPath(); ctx.moveTo(4, -9); ctx.lineTo(4, -14); ctx.stroke();
      const bladeLen = 30 * Math.abs(Math.cos(t * 28)) + 8;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.moveTo(4 - bladeLen, -15); ctx.lineTo(4 + bladeLen, -15); ctx.stroke();

      ctx.restore();
    }

    /* ==========================================================================
       GAME ENGINE & LOGIC
       ========================================================================== */
    function updateBalance(amount) {
      userBalance += amount;
      userBalanceEl.innerText = userBalance.toFixed(2);
    }

    function addBet(panelId, amount) {
      if (gameState !== STATES.PREPARATION || bets[panelId].active) return;
      const input = panelId === 1 ? betInput1 : betInput2;
      let val = parseFloat(input.value) || 0;
      input.value = Math.max(1, val + amount).toFixed(2);
    }

    function setMaxBet(panelId) {
      if (gameState !== STATES.PREPARATION || bets[panelId].active) return;
      const input = panelId === 1 ? betInput1 : betInput2;
      input.value = Math.max(1, userBalance).toFixed(2);
    }

    // AUTO CASHOUT: enable/disable the multiplier box with the toggle
    autoCashoutToggle1.addEventListener('change', e => { autoCashoutValue1.disabled = !e.target.checked; });
    autoCashoutToggle2.addEventListener('change', e => { autoCashoutValue2.disabled = !e.target.checked; });

    // AUTO CASHOUT: runs every flight tick, cashes out at the exact target multiplier
    function checkAutoCashout() {
      const cfg = {
        1: { toggle: autoCashoutToggle1, value: autoCashoutValue1 },
        2: { toggle: autoCashoutToggle2, value: autoCashoutValue2 }
      };
      for (const id in cfg) {
        const b = bets[id];
        const target = Math.max(1.01, parseFloat(cfg[id].value.value) || 0);
        if (cfg[id].toggle.checked && b.active && !b.cashedOut && currentMultiplier >= target) {
          cashOut(Number(id), target);
        }
      }
    }

    function showToast(message, type = 'info') {
      const colors = {
        win: 'border-neonGreen text-neonGreen',
        loss: 'border-neonPink text-neonPink',
        info: 'border-cyan-400 text-cyan-300'
      };
      const el = document.createElement('div');
      el.className = `glass-panel px-4 py-2 rounded-xl border font-mono text-xs font-bold ${colors[type] || colors.info}`;
      el.textContent = message;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function updateActionButtons() {
      [1, 2].forEach(id => {
        const btn = id === 1 ? actionBtn1 : actionBtn2;
        const b = bets[id];
        let label = 'PLACE BET';
        let disabled = false;

        if (gameState === STATES.PREPARATION) {
          label = b.active ? 'CANCEL BET' : 'PLACE BET';
        } else if (gameState === STATES.IN_FLIGHT) {
          if (b.active && !b.cashedOut) {
            label = `CASH OUT ${(b.amount * currentMultiplier).toFixed(2)}`;
          } else if (b.cashedOut) {
            label = `WON ${b.payout.toFixed(2)}`;
            disabled = true;
          } else {
            label = 'BET NEXT ROUND';
            disabled = true;
          }
        } else {
          label = b.cashedOut ? `WON ${b.payout.toFixed(2)}` : (b.active ? 'LOST' : 'NEXT ROUND SOON');
          disabled = true;
        }

        btn.querySelector('span').textContent = label;
        btn.disabled = disabled;
        btn.classList.toggle('opacity-50', disabled);
        btn.classList.toggle('cursor-not-allowed', disabled);
      });
    }

    function handleAction(panelId) {
      const b = bets[panelId];
      const input = panelId === 1 ? betInput1 : betInput2;

      if (gameState === STATES.PREPARATION) {
        if (b.active) {
          // Cancel bet and refund
          updateBalance(b.amount);
          b.active = false;
          b.amount = 0;
        } else {
          const amount = parseFloat(input.value) || 0;
          if (amount < 1) return showToast('Minimum bet is 1 PTS', 'loss');
          if (amount > userBalance) return showToast('Not enough credits', 'loss');
          updateBalance(-amount);
          b.active = true;
          b.amount = amount;
        }
        updateActionButtons();
      } else if (gameState === STATES.IN_FLIGHT && b.active && !b.cashedOut) {
        cashOut(panelId, currentMultiplier);
      }
    }

    function cashOut(panelId, atMultiplier) {
      const b = bets[panelId];
      if (!b.active || b.cashedOut || gameState !== STATES.IN_FLIGHT) return;
      b.cashedOut = true;
      b.cashedAt = atMultiplier;
      b.payout = b.amount * atMultiplier;
      updateBalance(b.payout);
      sound.playChime();
      showToast(`Panel ${panelId} cashed out ${atMultiplier.toFixed(2)}x  +${(b.payout - b.amount).toFixed(2)}`, 'win');
      updateActionButtons();
      renderPlayers();
    }

    actionBtn1.addEventListener('click', () => handleAction(1));
    actionBtn2.addEventListener('click', () => handleAction(2));

    /* ---------- Crash point (house edge ~3%) ---------- */
    function generateCrashPoint() {
      const r = Math.random();
      if (r < 0.03) return 1.00;
      return Math.min(1000, Math.max(1.00, Math.floor((0.97 / (1 - r)) * 100) / 100));
    }

    /* ---------- Simulated players ---------- */
    function generateBots() {
      botPlayers = [];
      const count = 6 + Math.floor(Math.random() * 6);
      for (let i = 0; i < count; i++) {
        botPlayers.push({
          name: botNames[Math.floor(Math.random() * botNames.length)] + Math.floor(Math.random() * 90 + 10),
          amount: [5, 10, 20, 50, 100, 250][Math.floor(Math.random() * 6)],
          target: Math.floor((1.1 + Math.random() * Math.random() * 8) * 100) / 100,
          cashedOut: false,
          payout: 0
        });
      }
      activePlayersCount.textContent = 120 + Math.floor(Math.random() * 60);
    }

    function updateBots() {
      let changed = false;
      botPlayers.forEach(bot => {
        if (!bot.cashedOut && currentMultiplier >= bot.target) {
          bot.cashedOut = true;
          bot.payout = bot.amount * bot.target;
          changed = true;
        }
      });
      if (changed) renderPlayers();
    }

    function renderPlayers() {
      if (sidebarTab === 'top') {
        const top = [...history].sort((a, b) => b - a).slice(0, 10);
        playersList.innerHTML = top.map((m, i) => `
          <div class="grid grid-cols-12 px-2 py-1.5 rounded-lg bg-slate-900/60 border border-slate-800">
            <span class="col-span-2 text-slate-500">#${i + 1}</span>
            <span class="col-span-5 text-slate-300">Round</span>
            <span class="col-span-5 text-right font-bold text-neonGold">${m.toFixed(2)}x</span>
          </div>`).join('');
        return;
      }

      const rows = [];
      [1, 2].forEach(id => {
        const b = bets[id];
        if (b.active) {
          rows.push({ name: `You (P${id})`, amount: b.amount, cashedOut: b.cashedOut, payout: b.payout, me: true });
        }
      });
      botPlayers.forEach(bot => rows.push({ ...bot, me: false }));

      playersList.innerHTML = rows.map(r => {
        const lost = gameState === STATES.CRASHED && !r.cashedOut;
        const payoutText = r.cashedOut ? r.payout.toFixed(2) : (lost ? '--' : '...');
        const payoutColor = r.cashedOut ? 'text-neonGreen' : (lost ? 'text-neonPink' : 'text-slate-500');
        return `
          <div class="grid grid-cols-12 px-2 py-1.5 rounded-lg border ${r.me ? 'bg-cyan-500/10 border-cyan-500/30' : 'bg-slate-900/60 border-slate-800'}">
            <span class="col-span-5 truncate ${r.me ? 'text-cyan-300 font-bold' : 'text-slate-300'}">${r.name}</span>
            <span class="col-span-3 text-right text-slate-400">${r.amount.toFixed(2)}</span>
            <span class="col-span-4 text-right font-bold ${payoutColor}">${payoutText}</span>
          </div>`;
      }).join('');
    }

    document.getElementById('tabLiveBets').addEventListener('click', () => {
      sidebarTab = 'live';
      document.getElementById('tabLiveBets').className = 'px-3 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/30';
      document.getElementById('tabTopHistory').className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition';
      renderPlayers();
    });
    document.getElementById('tabTopHistory').addEventListener('click', () => {
      sidebarTab = 'top';
      document.getElementById('tabTopHistory').className = 'px-3 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/30';
      document.getElementById('tabLiveBets').className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition';
      renderPlayers();
    });

    /* ---------- History bar ---------- */
    function renderHistory() {
      historyBar.innerHTML = history.slice().reverse().slice(0, 20).map(m => {
        const cls = m >= 10 ? 'text-neonGold border-yellow-500/40 bg-yellow-500/10'
                  : m >= 2 ? 'text-purple-300 border-purple-500/40 bg-purple-500/10'
                  : 'text-cyan-300 border-cyan-500/30 bg-cyan-500/10';
        return `<span class="px-2 py-0.5 rounded-md border shrink-0 ${cls}">${m.toFixed(2)}x</span>`;
      }).join('');
    }

    /* ---------- Round phases ---------- */
    function startPreparationPhase() {
      gameState = STATES.PREPARATION;
      prepTimer = 5.0;
      currentMultiplier = 1.00;
      particles = [];

      // Reset bets
      for (let key in bets) {
        bets[key].active = false;
        bets[key].cashedOut = false;
        bets[key].amount = 0;
        bets[key].payout = 0;
        bets[key].cashedAt = 0;
      }

      generateBots();
      updateActionButtons();
      renderPlayers();

      // UI Displays
      prepOverlay.classList.remove('hidden');
      inFlightOverlay.classList.add('hidden');
      inFlightOverlay.classList.remove('flex');
      crashOverlay.classList.add('hidden');
      crashOverlay.classList.remove('flex');

      clearInterval(prepInterval);
      prepInterval = setInterval(() => {
        prepTimer -= 0.1;
        if (prepTimer <= 0) {
          clearInterval(prepInterval);
          startFlightPhase();
          return;
        }
        countdownText.textContent = prepTimer.toFixed(1) + 's';
        countdownBar.style.width = (prepTimer / 5 * 100) + '%';
      }, 100);
    }

    function startFlightPhase() {
      gameState = STATES.IN_FLIGHT;
      targetCrashPoint = generateCrashPoint();
      startTime = performance.now();
      currentMultiplier = 1.00;
      flightGridOffset = 0;

      prepOverlay.classList.add('hidden');
      inFlightOverlay.classList.remove('hidden');
      inFlightOverlay.classList.add('flex');
      sound.startFlightTone();
      updateActionButtons();

      clearInterval(flightInterval);
      flightInterval = setInterval(() => {
        const t = (performance.now() - startTime) / 1000;
        currentMultiplier = Math.exp(0.1 * t);

        if (currentMultiplier >= targetCrashPoint) {
          // Let auto cashouts at or below the crash point still pay out first
          currentMultiplier = targetCrashPoint;
          checkAutoCashout();
          handleCrash();
          return;
        }

        liveMultiplierText.textContent = currentMultiplier.toFixed(2) + 'x';
        sound.updateFlightTone(currentMultiplier);

        checkAutoCashout();   // <-- AUTO CASHOUT runs every tick, before the crash check
        updateBots();
        updateActionButtons();
      }, 50);
    }

    function handleCrash() {
      clearInterval(flightInterval);
      gameState = STATES.CRASHED;
      sound.stopFlightTone();
      sound.playCrash();

      const { endX, endY } = getFlightGeometry();
      spawnExplosion(endX, endY);

      history.push(targetCrashPoint);
      if (history.length > 30) history.shift();
      renderHistory();

      inFlightOverlay.classList.add('hidden');
      inFlightOverlay.classList.remove('flex');
      crashOverlay.classList.remove('hidden');
      crashOverlay.classList.add('flex');
      crashedMultiplierText.textContent = targetCrashPoint.toFixed(2) + 'x';

      [1, 2].forEach(id => {
        if (bets[id].active && !bets[id].cashedOut) {
          showToast(`Panel ${id} lost ${bets[id].amount.toFixed(2)}`, 'loss');
        }
      });

      updateActionButtons();
      renderPlayers();
      setTimeout(startPreparationPhase, 3000);
    }

    /* ---------- Header buttons ---------- */
    document.getElementById('reloadCreditsBtn').addEventListener('click', () => {
      userBalance = 1000;
      userBalanceEl.innerText = userBalance.toFixed(2);
      showToast('Credits refilled to 1000', 'info');
    });

    document.getElementById('audioToggleBtn').addEventListener('click', () => {
      sound.muted = !sound.muted;
      document.getElementById('audioIcon').className = sound.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
      if (sound.muted) sound.stopFlightTone();
      else if (gameState === STATES.IN_FLIGHT) sound.startFlightTone();
    });

    /* ---------- Init ---------- */
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    renderHistory();
    updateBalance(0);
    requestAnimationFrame(renderCanvas);
    startPreparationPhase();
  </script>

(() => {

const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const crashFrom = h => { const n = parseInt(h.slice(0,13),16), e = 2**52; return n % 33 === 0 ? 1 : Math.min(1000, Math.floor((100*e - n)/(e - n))/100); };
async function newFair(){
  R = { seed: hex(16), hash:'', cs: F.cs, nonce: F.nonce, pending: null };
  const mine = R;
  try { mine.hash = await sha(mine.seed); mine.pending = crashFrom(await sha(`${mine.seed}:${mine.cs}:${mine.nonce}`)); } catch(e) { mine.hash = 'unavailable (needs https)'; }
  renderFair();
}

   (p ? `<div class="pt-1 border-t border-slate-800"><span class="text-slate-500">Last server seed:</span> ${p.seed}</div>
   <div>Crash ${p.crash.toFixed(2)}x ${p.ok === true ? '<span class="text-neonGreen">verified ✓</span>' : p.ok === false ? '<span class="text-neonPink">mismatch ✗</span>' : ''}</div>` : '');
}

const _crash = handleCrash;
handleCrash = function(){
  _crash(); const c = targetCrashPoint; let played = false, won = false;
  [1,2].forEach(id => { const b = bets[id]; if (!b.active) return; played = true; S.profit += (b.cashedOut ? b.payout : 0) - b.amount;
    if (b.cashedOut) { won = true; S.best = Math.max(S.best, b.cashedAt); lbAdd(prof.name, b.payout - b.amount, b.cashedAt); } });
  if (played) { S.rounds++; M.play++; if (won) { S.wins++; S.streak++; if (S.streak >= 3) toast(`🔥 ${S.streak} wins in a row!`,'win'); } else S.streak = 0; }
  botPlayers.forEach(b => { if (b.cashedOut) lbAdd(b.name, b.payout - b.amount, b.target); });
  const nm = botPlayers.find(b => b.cashedOut && b.target >= c * 0.92);
  if (nm) flash(`😮 NEAR MISS: ${nm.name} escaped at ${nm.target.toFixed(2)}x`);
  vib(played && !won ? [120,60,120] : 80);
  // provably fair reveal + verification
  const snap = { seed:R.seed, hash:R.hash, cs:R.cs, nonce:R.nonce, crash:c, ok:null };
  if (R.pending != null) (async () => { try { snap.ok = (await sha(snap.seed)) === snap.hash && crashFrom(await sha(`${snap.seed}:${snap.cs}:${snap.nonce}`)) === c; } catch(e) {} prevRound = snap; renderFair(); })();

    ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(4,0,3,0,7); ctx.fillStyle = '#9d00ff'; ctx.fill();
  } else if (prof.veh === 'rocket') {
    ctx.rotate(a); ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(-34 - Math.random()*14,(Math.random()-.5)*6); ctx.lineTo(-16,5); ctx.closePath(); ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ff0055'; ctx.fill();
    ctx.shadowColor = '#00f3ff'; ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(26,0); ctx.quadraticCurveTo(14,-9,-16,-7); ctx.lineTo(-16,7); ctx.quadraticCurveTo(14,9,26,0); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,-7); ctx.lineTo(-17,-15); ctx.lineTo(-16,-7); ctx.moveTo(-6,7); ctx.lineTo(-17,15); ctx.lineTo(-16,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(6,0,3,0,7); ctx.fillStyle = '#9d00ff'; ctx.fill();
  } else { // drone
    ctx.rotate(0.1 + a * 0.2); ctx.fillRect(-12,-4,24,8); ctx.strokeRect(-12,-4,24,8);
    ctx.beginPath(); ctx.arc(0,0,3,0,7); ctx.fillStyle = '#ff0055'; ctx.fill();
    [-16,16].forEach(ox => { ctx.beginPath(); ctx.moveTo(ox,-4); ctx.lineTo(ox,-9); ctx.strokeStyle = '#00f3ff'; ctx.stroke();
      const l = 12 * Math.abs(Math.cos(t*30 + ox)) + 3; ctx.beginPath(); ctx.moveTo(ox-l,-10); ctx.lineTo(ox+l,-10); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.stroke(); });
  }

};
